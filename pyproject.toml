[project]
name = "fromragtoagents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "George Taschina", email = "g.taschina@georgetaschina.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gitsource>=0.0.5",
    "jupyter>=1.1.1",
    "minsearch>=0.2.0",
    "openai>=3.17.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "python-frontmatter>=1.3.0",
    "requests>=2.34.2",
]

[project.scripts]
fromragtoagents = "fromragtoagents:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
